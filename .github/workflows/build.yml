name: Build Chromium WebView APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Obtener fecha y hora para el Tag
        id: timestamp
        run: |
          echo "tag_name=WebView-Build-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Mover el directorio de trabajo a la partición con más espacio (/mnt)
        run: |
          # Liberar espacio basura inicial
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

          # Crear carpetas en /mnt (partición masiva del runner de GitHub)
          sudo mkdir -p /mnt/work
          sudo chown -R runner:docker /mnt/work

          # Redireccionar el caché de Python/vpython hacia /mnt
          mkdir -p /mnt/work/.cache
          mkdir -p /mnt/work/vpython
          ln -s /mnt/work/.cache ~/.cache

      - name: Configurar dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl build-essential ninja-build

      - name: Instalar depot_tools
        run: |
          cd /mnt/work
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "/mnt/work/depot_tools" >> $GITHUB_PATH

      - name: Descargar fuente de Chromium (WebView)
        run: |
          export PATH="/mnt/work/depot_tools:$PATH"
          export VPYTHON_VIRTUALENV_ROOT="/mnt/work/vpython"
          
          cd /mnt/work
          mkdir chromium && cd chromium
          
          # Descarga optimizada en la partición ampliada
          fetch --no-history --no-hooks android
          cd src
          gclient sync --no-history --shallow --no-hooks
          ./build/install-build-deps.sh --android

      - name: Configurar y compilar WebView APK
        run: |
          export PATH="/mnt/work/depot_tools:$PATH"
          export VPYTHON_VIRTUALENV_ROOT="/mnt/work/vpython"
          
          cd /mnt/work/chromium/src
          
          # Configuración de compilación para Android ARM64 Release
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false is_official_build=true system_webview_package_name="com.android.webview"'
          
          # Compilar APK de WebView
          autoninja -C out/Default system_webview_apk

      - name: Crear Release y subir el APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.timestamp.outputs.tag_name }}
          name: Release ${{ steps.timestamp.outputs.tag_name }}
          files: |
            /mnt/work/chromium/src/out/Default/apks/SystemWebView.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
