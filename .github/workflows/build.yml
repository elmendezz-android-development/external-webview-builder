name: Build Chromium WebView APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest-arm64

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Obtener fecha y hora para el Tag
        id: timestamp
        run: |
          echo "tag_name=WebView-Build-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Limpiar espacio basura del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl build-essential ninja-build

      - name: Instalar depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Descargar fuente de Chromium (WebView)
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          mkdir chromium && cd chromium
          fetch --no-history --no-hooks android
          cd src
          gclient sync --no-history --shallow --no-hooks
          ./build/install-build-deps.sh --android

      - name: Configurar y compilar WebView APK
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd chromium/src
          
          gn gen out/Default --args='target_os="android" target_cpu="arm64" is_debug=false is_official_build=true system_webview_package_name="com.android.webview"'
          autoninja -C out/Default system_webview_apk

      - name: Crear Release y subir el APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.timestamp.outputs.tag_name }}
          name: Release ${{ steps.timestamp.outputs.tag_name }}
          files: |
            chromium/src/out/Default/apks/SystemWebView.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
